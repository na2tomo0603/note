<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Creema→Minne">
  <meta name="theme-color" content="#FF6B9D">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <title>Creema → Minne</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:   #FF6B9D;
      --pink-d: #e0578a;
      --mint:   #4ECDC4;
      --bg:     #0f1117;
      --surface:  #1a1d26;
      --surface2: #23263a;
      --text:   #e8eaf0;
      --muted:  #7b8099;
      --green:  #4caf82;
      --red:    #ff5c5c;
      --radius: 16px;
      --safe-top:    env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      overscroll-behavior: none;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      padding: 14px 20px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #2a2d3d;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .logo-wrap { display: flex; align-items: center; gap: 6px; font-size: 20px; }
    .arrow { color: var(--muted); font-size: 14px; }
    header h1 { font-size: 17px; font-weight: 800; }
    header small { font-size: 11px; color: var(--muted); display: block; }

    /* ── Tabs ── */
    nav.tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid #2a2d3d;
    }
    .tab {
      flex: 1; padding: 11px 4px; border: none; background: none;
      color: var(--muted); font-size: 12px; font-weight: 600;
      cursor: pointer; position: relative; transition: color .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .tab.on { color: var(--pink); }
    .tab.on::after {
      content: ""; position: absolute; bottom: 0; left: 15%; right: 15%;
      height: 2px; background: var(--pink); border-radius: 2px;
    }

    /* ── Panels ── */
    .panel { display: none; padding: 16px; padding-bottom: 32px; }
    .panel.on { display: block; }

    /* ── Step bar ── */
    .stepbar { display: flex; gap: 6px; margin-bottom: 16px; }
    .sbar { flex: 1; height: 3px; border-radius: 2px; background: var(--surface2); transition: background .4s; }
    .sbar.done { background: var(--pink); }
    .sbar.cur  { background: var(--pink); opacity: .45; }

    /* ── Card ── */
    .card {
      background: var(--surface); border-radius: var(--radius);
      padding: 16px; margin-bottom: 14px;
    }
    .label {
      font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .8px; margin-bottom: 10px;
    }

    /* ── Inputs ── */
    input[type="url"], input[type="text"],
    input[type="email"], input[type="password"],
    input[type="number"], textarea {
      width: 100%; background: var(--surface2);
      border: 1.5px solid #2a2d3d; border-radius: 12px;
      padding: 13px 14px; color: var(--text); font-size: 15px;
      outline: none; transition: border-color .2s; -webkit-appearance: none;
    }
    input:focus, textarea:focus { border-color: var(--pink); }
    textarea { resize: vertical; min-height: 120px; font-family: inherit; line-height: 1.6; }

    /* ── Button ── */
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 15px; border-radius: 14px; border: none;
      font-size: 15px; font-weight: 700; cursor: pointer;
      transition: opacity .2s, transform .1s; -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(.97); opacity: .82; }
    .btn-pink   { background: var(--pink);   color: #fff; }
    .btn-mint   { background: var(--mint);   color: #fff; }
    .btn-ghost  { background: var(--surface2); color: var(--text); }
    .btn:disabled { opacity: .4; pointer-events: none; }
    .btn + .btn { margin-top: 10px; }

    /* ── Spinner ── */
    .spin {
      width: 17px; height: 17px;
      border: 2.5px solid rgba(255,255,255,.3);
      border-top-color: #fff; border-radius: 50%;
      animation: rot .6s linear infinite; display: none;
    }
    @keyframes rot { to { transform: rotate(360deg); } }

    /* ── Progress log ── */
    .logbox {
      background: var(--surface2); border-radius: 12px;
      padding: 12px; max-height: 180px; overflow-y: auto;
      font-size: 11.5px; font-family: "SF Mono","Menlo",monospace;
      color: var(--mint); line-height: 1.9; display: none; margin-top: 12px;
    }
    .logbox.on { display: block; }

    /* ── Status ── */
    .status { font-size: 13px; padding: 10px 14px; border-radius: 10px; margin-top: 12px; display: none; }
    .status.ok  { background: #1a3a2a; color: var(--green); display: block; }
    .status.err { background: #3a1a1a; color: var(--red);   display: block; }

    /* ── Product preview ── */
    .prod-imgs {
      display: flex; gap: 8px; overflow-x: auto;
      padding-bottom: 6px; margin-bottom: 12px; -webkit-overflow-scrolling: touch;
    }
    .prod-imgs img {
      width: 80px; height: 80px; object-fit: cover;
      border-radius: 10px; flex-shrink: 0; border: 1.5px solid #2a2d3d;
    }
    .prod-title { font-size: 18px; font-weight: 800; line-height: 1.3; margin-bottom: 6px; }
    .prod-price { font-size: 22px; font-weight: 900; color: var(--pink); margin-bottom: 8px; }
    .prod-desc  { font-size: 13px; color: #cdd0e0; line-height: 1.75; white-space: pre-wrap; }
    .tag { display: inline-block; font-size: 11px; font-weight: 600;
           padding: 3px 8px; border-radius: 20px; background: #1a1d26;
           color: var(--muted); border: 1px solid #2a2d3d; margin: 2px; }

    /* ── Sep ── */
    .sep { height: 1px; background: #2a2d3d; margin: 14px 0; }

    /* ── Info row ── */
    .info-row { display: flex; justify-content: space-between; align-items: center;
                font-size: 13px; padding: 6px 0; border-bottom: 1px solid #2a2d3d; }
    .info-row:last-child { border-bottom: none; }
    .info-row .k { color: var(--muted); }
    .info-row .v { font-weight: 600; }
  </style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <span>🛍️</span>
    <span class="arrow">→</span>
    <span>🧶</span>
  </div>
  <div>
    <h1>Creema → Minne</h1>
    <small>商品自動登録アプリ</small>
  </div>
</header>

<nav class="tabs">
  <button class="tab on"  onclick="go('fetch')">① 取得</button>
  <button class="tab"     onclick="go('edit')">② 編集</button>
  <button class="tab"     onclick="go('post')">③ 登録</button>
  <button class="tab"     onclick="go('settings')">設定</button>
</nav>

<!-- ① 取得 -->
<div id="p-fetch" class="panel on">
  <div class="stepbar">
    <div class="sbar cur" id="s1"></div>
    <div class="sbar"     id="s2"></div>
    <div class="sbar"     id="s3"></div>
  </div>

  <div class="card">
    <div class="label">Creema 商品URL</div>
    <input type="url" id="creema-url"
      placeholder="https://www.creema.jp/item/XXXXXXXX/detail"
      inputmode="url" autocomplete="off" autocorrect="off" spellcheck="false">
  </div>

  <button class="btn btn-pink" id="btn-fetch" onclick="fetchProduct()">
    <span class="spin" id="sp-fetch"></span>
    <span id="lb-fetch">商品情報を取得する</span>
  </button>

  <div class="logbox" id="log-fetch"></div>
  <div class="status" id="st-fetch"></div>
</div>

<!-- ② 編集 -->
<div id="p-edit" class="panel">
  <div class="card">
    <div class="label">プレビュー</div>
    <div class="prod-imgs" id="preview-imgs"></div>
    <div class="prod-title" id="preview-title">—</div>
    <div class="prod-price" id="preview-price"></div>
    <div style="margin-bottom:10px;" id="preview-tags"></div>
    <div class="prod-desc"  id="preview-desc"></div>
  </div>

  <div class="card">
    <div class="label">タイトル（60文字以内）</div>
    <input type="text" id="e-title" maxlength="60" placeholder="作品タイトル">
  </div>
  <div class="card">
    <div class="label">価格（円）</div>
    <input type="number" id="e-price" placeholder="1000" inputmode="numeric">
  </div>
  <div class="card">
    <div class="label">在庫数</div>
    <input type="number" id="e-stock" value="1" min="1" inputmode="numeric">
  </div>
  <div class="card">
    <div class="label">説明文（1000文字以内）</div>
    <textarea id="e-desc" maxlength="1000" placeholder="作品の説明を入力..."></textarea>
  </div>

  <button class="btn btn-ghost" onclick="saveEdit()">変更を保存</button>
  <div class="status" id="st-edit"></div>
</div>

<!-- ③ 登録 -->
<div id="p-post" class="panel">
  <div class="card">
    <div class="label">登録内容の確認</div>
    <div class="info-row"><span class="k">タイトル</span><span class="v" id="c-title">—</span></div>
    <div class="info-row"><span class="k">価格</span><span class="v" id="c-price">—</span></div>
    <div class="info-row"><span class="k">在庫</span><span class="v" id="c-stock">—</span></div>
    <div class="info-row"><span class="k">画像</span><span class="v" id="c-imgs">—</span></div>
  </div>

  <div class="card">
    <div class="label">Minneアカウント</div>
    <input type="email" id="m-email"    placeholder="メールアドレス" style="margin-bottom:8px">
    <input type="password" id="m-pass" placeholder="パスワード">
  </div>

  <button class="btn btn-mint" id="btn-post" onclick="postProduct()">
    <span class="spin" id="sp-post"></span>
    <span id="lb-post">Minne に下書き登録する</span>
  </button>

  <div class="logbox" id="log-post"></div>
  <div class="status" id="st-post"></div>
</div>

<!-- 設定 -->
<div id="p-settings" class="panel">
  <div class="card">
    <div class="label">Minne アカウント（保存）</div>
    <input type="email"    id="s-email" placeholder="メールアドレス" style="margin-bottom:8px">
    <input type="password" id="s-pass"  placeholder="パスワード">
  </div>
  <button class="btn btn-ghost" onclick="saveSettings()">設定を保存</button>
  <div class="status" id="st-settings"></div>
</div>

<script>
const $ = id => document.getElementById(id);

// ── タブ切り替え ──────────────────────────────────────────────
function go(name) {
  ['fetch','edit','post','settings'].forEach((n,i) => {
    $('p-'+n).classList.toggle('on', n === name);
    document.querySelectorAll('.tab')[i].classList.toggle('on', n === name);
  });
  if (name === 'edit' || name === 'post') loadProduct();
}

// ── ① 商品取得 ────────────────────────────────────────────────
async function fetchProduct() {
  const url = $('creema-url').value.trim();
  if (!url) { showSt('st-fetch', 'URLを入力してください', false); return; }

  setBtn('btn-fetch','sp-fetch','lb-fetch', true, '取得中...');
  showLog('log-fetch', true);
  $('st-fetch').className = 'status';

  let polling = true;
  startPoll('log-fetch', () => polling);

  try {
    const res = await post('/api/scrape', { url });
    polling = false;

    if (res.ok) {
      $('s1').className = 'sbar done';
      $('s2').className = 'sbar cur';
      showSt('st-fetch', `取得完了！「② 編集」タブで内容を確認できます`, true);
      fillEdit(res.product);
    } else {
      showSt('st-fetch', res.error || 'エラーが発生しました', false);
    }
  } catch(e) {
    polling = false;
    showSt('st-fetch', '通信エラー: ' + e.message, false);
  }
  setBtn('btn-fetch','sp-fetch','lb-fetch', false, '商品情報を取得する');
}

// ── 商品データをフォームに反映 ─────────────────────────────────
function fillEdit(p) {
  $('e-title').value = p.title || '';
  $('e-price').value = p.price || '';
  $('e-stock').value = p.stock || 1;
  $('e-desc').value  = p.description || '';
  updatePreview(p);
}

function updatePreview(p) {
  p = p || {
    title: $('e-title').value,
    price: parseInt($('e-price').value) || 0,
    description: $('e-desc').value,
    images: [],
    tags: [],
  };
  $('preview-title').textContent = p.title || '—';
  $('preview-price').textContent = p.price ? `¥${p.price.toLocaleString()}` : '';
  $('preview-desc').textContent  = p.description || '';
  $('preview-tags').innerHTML    = (p.tags||[]).map(t => `<span class="tag">#${esc(t)}</span>`).join('');
  $('preview-imgs').innerHTML    = (p.images||[]).slice(0,5).map(u =>
    `<img src="${esc(u)}" loading="lazy" onerror="this.style.display='none'">`
  ).join('');
}

['e-title','e-price','e-desc','e-stock'].forEach(id => {
  $(id).addEventListener('input', () => updatePreview());
});

// ── 商品データロード ──────────────────────────────────────────
async function loadProduct() {
  try {
    const res = await get('/api/product');
    if (res.ok) {
      fillEdit(res.product);
      const p = res.product;
      $('c-title').textContent = (p.title||'').slice(0,20) + (p.title?.length>20?'…':'');
      $('c-price').textContent = p.price ? `¥${p.price.toLocaleString()}` : '—';
      $('c-stock').textContent = p.stock || 1;
      $('c-imgs').textContent  = `${(p.images||[]).length}枚`;
      // 設定からアカウント補完
      const s = await get('/api/settings');
      if (s.ok && s.settings.email) $('m-email').value = s.settings.email;
    }
  } catch {}
}

// ── ② 編集保存 ───────────────────────────────────────────────
async function saveEdit() {
  try {
    const res = await put('/api/product', {
      title: $('e-title').value,
      price: parseInt($('e-price').value) || 0,
      stock: parseInt($('e-stock').value) || 1,
      description: $('e-desc').value,
    });
    showSt('st-edit', res.ok ? '保存しました' : res.error, res.ok);
  } catch(e) {
    showSt('st-edit', 'エラー: ' + e.message, false);
  }
}

// ── ③ Minne登録 ──────────────────────────────────────────────
async function postProduct() {
  const email = $('m-email').value.trim();
  const pass  = $('m-pass').value.trim();
  if (!email || !pass) {
    showSt('st-post', 'メールアドレスとパスワードを入力してください', false);
    return;
  }

  setBtn('btn-post','sp-post','lb-post', true, '登録中...');
  showLog('log-post', true);
  $('st-post').className = 'status';

  let polling = true;
  startPoll('log-post', () => polling);

  try {
    const res = await post('/api/post', { email, password: pass });
    polling = false;

    if (res.ok) {
      $('s2').className = 'sbar done';
      $('s3').className = 'sbar done';
      showSt('st-post', 'Minne に下書き登録しました！', true);
    } else {
      showSt('st-post', res.error || '登録に失敗しました', false);
    }
  } catch(e) {
    polling = false;
    showSt('st-post', '通信エラー: ' + e.message, false);
  }
  setBtn('btn-post','sp-post','lb-post', false, 'Minne に下書き登録する');
}

// ── 設定保存 ─────────────────────────────────────────────────
async function saveSettings() {
  try {
    const res = await put('/api/settings', {
      email:    $('s-email').value.trim(),
      password: $('s-pass').value.trim(),
    });
    showSt('st-settings', res.ok ? '保存しました' : res.error, res.ok);
  } catch(e) {
    showSt('st-settings', 'エラー: ' + e.message, false);
  }
}

// ── 初期化 ───────────────────────────────────────────────────
async function init() {
  try {
    const s = await get('/api/settings');
    if (s.ok && s.settings.email) {
      $('s-email').value = s.settings.email;
      $('m-email').value = s.settings.email;
    }
  } catch {}
}
init();

// ── Utilities ────────────────────────────────────────────────
function setBtn(btn, sp, lb, on, label) {
  $(btn).disabled = on;
  $(sp).style.display = on ? 'block' : 'none';
  $(lb).textContent = label;
}
function showSt(id, msg, ok) {
  const el = $(id);
  el.textContent = msg;
  el.className = 'status ' + (ok ? 'ok' : 'err');
}
function showLog(id, on) {
  $(id).className = 'logbox' + (on ? ' on' : '');
  $(id).innerHTML = '';
}
function appendLog(id, line) {
  const el = $(id);
  const p = document.createElement('div');
  p.textContent = line;
  el.appendChild(p);
  el.scrollTop = el.scrollHeight;
}
function startPoll(logId, isRunning) {
  (async () => {
    while (isRunning()) {
      await sleep(1200);
      try {
        const r = await get('/api/progress');
        if (r.logs) {
          $(logId).innerHTML = r.logs.map(l => `<div>${esc(l)}</div>`).join('');
          $(logId).scrollTop = $(logId).scrollHeight;
        }
      } catch {}
    }
  })();
}

async function get(url)           { const r = await fetch(url); return r.json(); }
async function post(url, body)    { const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) }); return r.json(); }
async function put(url, body)     { const r = await fetch(url, { method:'PUT',  headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) }); return r.json(); }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// PWA
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/static/sw.js').catch(() => {});
}
</script>
</body>
</html>
