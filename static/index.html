<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="YouTube→note">
  <meta name="theme-color" content="#41C9B4">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <title>YouTube → note</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #41C9B4;
      --accent-dark: #2ba896;
      --bg: #0f1117;
      --surface: #1a1d26;
      --surface2: #23263a;
      --text: #e8eaf0;
      --text-muted: #7b8099;
      --danger: #ff5c5c;
      --success: #4caf82;
      --radius: 16px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    /* ── ヘッダー ── */
    header {
      background: var(--surface);
      padding: 16px 20px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #2a2d3d;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header .logo { font-size: 24px; }
    header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    header span.sub { font-size: 11px; color: var(--text-muted); display: block; margin-top: 1px; }

    /* ── タブ ── */
    .tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid #2a2d3d;
    }
    .tab-btn {
      flex: 1;
      padding: 12px 0;
      border: none;
      background: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      transition: color .2s;
    }
    .tab-btn.active {
      color: var(--accent);
    }
    .tab-btn.active::after {
      content: "";
      position: absolute;
      bottom: 0; left: 10%; right: 10%;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
    }

    /* ── パネル ── */
    .panel { display: none; padding: 20px 16px; }
    .panel.active { display: block; }

    /* ── カード ── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }

    /* ── 入力 ── */
    .input-wrap { position: relative; }
    input[type="url"], input[type="text"], textarea {
      width: 100%;
      background: var(--surface2);
      border: 1.5px solid #2a2d3d;
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color .2s;
      -webkit-appearance: none;
    }
    input[type="url"]:focus, input[type="text"]:focus, textarea:focus {
      border-color: var(--accent);
    }
    textarea { resize: vertical; min-height: 160px; font-family: inherit; line-height: 1.6; }

    /* ── ボタン ── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.97); opacity: 0.85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--surface2); color: var(--text); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn:disabled { opacity: 0.45; pointer-events: none; }

    /* ── プログレス ── */
    .progress-box {
      background: var(--surface2);
      border-radius: 12px;
      padding: 14px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 12px;
      font-family: "SF Mono", "Menlo", monospace;
      color: var(--accent);
      line-height: 1.8;
      display: none;
    }
    .progress-box.show { display: block; }
    .progress-line { margin: 0; }

    /* ── バッジ ── */
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      background: var(--surface2);
      color: var(--text-muted);
      margin: 2px;
    }
    .badge.green { background: #1a3a2a; color: var(--success); }

    /* ── アーティクルプレビュー ── */
    .article-title-display {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 8px;
    }
    .tags-wrap { margin-bottom: 14px; }
    .article-body-display {
      font-size: 14px;
      line-height: 1.8;
      color: #cdd0e0;
      white-space: pre-wrap;
    }

    /* ── ステータス ── */
    .status-msg {
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 10px;
      margin-top: 12px;
      display: none;
    }
    .status-msg.ok { background: #1a3a2a; color: var(--success); display: block; }
    .status-msg.err { background: #3a1a1a; color: var(--danger); display: block; }

    /* ── スピナー ── */
    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── セパレーター ── */
    .sep { height: 1px; background: #2a2d3d; margin: 16px 0; }

    /* ── ステップインジケーター ── */
    .steps {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
    }
    .step {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: var(--surface2);
      transition: background .3s;
    }
    .step.done { background: var(--accent); }
    .step.active { background: var(--accent); opacity: 0.5; }
  </style>
</head>
<body>

<header>
  <div class="logo">🎬</div>
  <div>
    <h1>YouTube → note</h1>
    <span class="sub">自動記事生成・投稿アプリ</span>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('generate')">① 記事生成</button>
  <button class="tab-btn" onclick="switchTab('edit')">② 編集</button>
  <button class="tab-btn" onclick="switchTab('post')">③ 投稿</button>
</div>

<!-- ── ① 記事生成タブ ── -->
<div id="tab-generate" class="panel active">
  <div class="steps">
    <div class="step active" id="step1"></div>
    <div class="step" id="step2"></div>
    <div class="step" id="step3"></div>
  </div>

  <div class="card">
    <div class="card-title">YouTube URL</div>
    <input type="url" id="yt-url" placeholder="https://www.youtube.com/watch?v=..." inputmode="url" autocomplete="off" autocorrect="off" spellcheck="false">
  </div>

  <button class="btn btn-primary" id="btn-generate" onclick="generate()">
    <span id="gen-spinner" class="spinner"></span>
    <span id="gen-label">記事を生成する</span>
  </button>

  <div id="progress-box" class="progress-box"></div>
  <div id="gen-status" class="status-msg"></div>
</div>

<!-- ── ② 編集タブ ── -->
<div id="tab-edit" class="panel">
  <div class="card">
    <div class="card-title">タイトル</div>
    <input type="text" id="edit-title" placeholder="記事タイトル">
  </div>

  <div class="card">
    <div class="card-title">タグ</div>
    <input type="text" id="edit-tags" placeholder="副業, 在宅ワーク, ...">
  </div>

  <div class="card">
    <div class="card-title">本文（Markdown）</div>
    <textarea id="edit-body" placeholder="本文を入力..."></textarea>
  </div>

  <button class="btn btn-secondary" onclick="saveEdit()">
    <span id="save-label">変更を保存</span>
  </button>
  <div id="edit-status" class="status-msg"></div>

  <div class="sep"></div>

  <div class="card">
    <div class="card-title">プレビュー</div>
    <div class="article-title-display" id="preview-title">—</div>
    <div class="tags-wrap" id="preview-tags"></div>
    <div class="article-body-display" id="preview-body"></div>
  </div>
</div>

<!-- ── ③ 投稿タブ ── -->
<div id="tab-post" class="panel">
  <div class="card">
    <div class="card-title">投稿内容の確認</div>
    <p style="font-size:14px; color:var(--text-muted); line-height:1.7;">
      <strong id="confirm-title" style="color:var(--text); font-size:16px;">—</strong><br>
      <span id="confirm-tags" style="font-size:12px;"></span>
    </p>
    <div class="sep"></div>
    <p style="font-size:13px; color:var(--text-muted); line-height:1.6;">
      note.com にブラウザで自動ログインし、<br>下書き保存します。
    </p>
  </div>

  <button class="btn btn-primary" id="btn-post" onclick="postArticle()">
    <span id="post-spinner" class="spinner"></span>
    <span id="post-label">note.com に下書き投稿</span>
  </button>

  <div id="post-progress-box" class="progress-box" style="margin-top:12px;"></div>
  <div id="post-status" class="status-msg"></div>
</div>

<script>
const $ = id => document.getElementById(id);

// ── タブ切り替え ──
function switchTab(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  $(`tab-${name}`).classList.add('active');
  const idx = ['generate','edit','post'].indexOf(name);
  document.querySelectorAll('.tab-btn')[idx].classList.add('active');

  if (name === 'edit' || name === 'post') loadArticle();
}

// ── 記事生成 ──
async function generate() {
  const url = $('yt-url').value.trim();
  if (!url) { showStatus('gen-status', 'URLを入力してください', false); return; }

  setLoading('btn-generate', 'gen-spinner', 'gen-label', true, '生成中...');
  $('progress-box').className = 'progress-box show';
  $('progress-box').innerHTML = '';
  $('gen-status').className = 'status-msg';
  $('step1').className = 'step active';

  // 進捗ポーリング
  let polling = true;
  const poll = async () => {
    while (polling) {
      await sleep(1200);
      try {
        const r = await fetch('/api/progress');
        const d = await r.json();
        $('progress-box').innerHTML = d.logs.map(l => `<p class="progress-line">${esc(l)}</p>`).join('');
        $('progress-box').scrollTop = $('progress-box').scrollHeight;
      } catch {}
    }
  };
  poll();

  try {
    const res = await fetch('/api/process', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({url})
    });
    const data = await res.json();
    polling = false;

    if (data.ok) {
      $('step1').className = 'step done';
      $('step2').className = 'step active';
      showStatus('gen-status', '記事生成完了！「② 編集」タブで確認できます', true);
      // 編集タブに転送
      $('edit-title').value = data.title || '';
      $('edit-tags').value = data.tags || '';
      $('edit-body').value = data.body || '';
      updatePreview();
    } else {
      showStatus('gen-status', data.error || 'エラーが発生しました', false);
    }
  } catch (e) {
    polling = false;
    showStatus('gen-status', `通信エラー: ${e.message}`, false);
  }

  setLoading('btn-generate', 'gen-spinner', 'gen-label', false, '記事を生成する');
}

// ── 記事ロード ──
async function loadArticle() {
  try {
    const res = await fetch('/api/article');
    const data = await res.json();
    if (data.ok) {
      $('edit-title').value = data.title || '';
      $('edit-body').value = data.body || '';
      // タグ行を抽出
      const tagMatch = data.body.match(/^\*\*タグ:\*\*\s*(.+)/m);
      $('edit-tags').value = tagMatch ? tagMatch[1].trim() : '';
      $('confirm-title').textContent = data.title || '—';
      $('confirm-tags').textContent = tagMatch ? tagMatch[1].trim() : '';
      updatePreview();
    }
  } catch {}
}

// ── 編集保存 ──
async function saveEdit() {
  $('save-label').textContent = '保存中...';
  try {
    const res = await fetch('/api/article', {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        title: $('edit-title').value,
        tags: $('edit-tags').value,
        body: $('edit-body').value
      })
    });
    const data = await res.json();
    showStatus('edit-status', data.ok ? '保存しました' : data.error, data.ok);
    updatePreview();
  } catch (e) {
    showStatus('edit-status', `エラー: ${e.message}`, false);
  }
  $('save-label').textContent = '変更を保存';
}

// ── プレビュー更新 ──
function updatePreview() {
  $('preview-title').textContent = $('edit-title').value || '—';
  const tags = $('edit-tags').value.split(/[,、]/).map(t => t.trim()).filter(Boolean);
  $('preview-tags').innerHTML = tags.map(t => `<span class="badge green">#${t}</span>`).join('');
  $('preview-body').textContent = $('edit-body').value;
  $('confirm-title').textContent = $('edit-title').value || '—';
  $('confirm-tags').textContent = $('edit-tags').value;
}

['edit-title','edit-tags','edit-body'].forEach(id => {
  $(id).addEventListener('input', updatePreview);
});

// ── 投稿 ──
async function postArticle() {
  setLoading('btn-post', 'post-spinner', 'post-label', true, '投稿中...');
  $('post-progress-box').className = 'progress-box show';
  $('post-progress-box').innerHTML = '';
  $('post-status').className = 'status-msg';

  let polling = true;
  const poll = async () => {
    while (polling) {
      await sleep(1500);
      try {
        const r = await fetch('/api/progress');
        const d = await r.json();
        $('post-progress-box').innerHTML = d.logs.map(l => `<p class="progress-line">${esc(l)}</p>`).join('');
        $('post-progress-box').scrollTop = $('post-progress-box').scrollHeight;
      } catch {}
    }
  };
  poll();

  try {
    const res = await fetch('/api/post', { method: 'POST' });
    const data = await res.json();
    polling = false;
    if (data.ok) {
      $('step2').className = 'step done';
      $('step3').className = 'step done';
      showStatus('post-status', 'note.com に下書き保存しました！', true);
    } else {
      showStatus('post-status', data.error || '投稿に失敗しました', false);
    }
  } catch (e) {
    polling = false;
    showStatus('post-status', `通信エラー: ${e.message}`, false);
  }

  setLoading('btn-post', 'post-spinner', 'post-label', false, 'note.com に下書き投稿');
}

// ── ユーティリティ ──
function setLoading(btnId, spinnerId, labelId, on, label) {
  $(btnId).disabled = on;
  $(spinnerId).style.display = on ? 'block' : 'none';
  $(labelId).textContent = label;
}

function showStatus(id, msg, ok) {
  const el = $(id);
  el.textContent = msg;
  el.className = `status-msg ${ok ? 'ok' : 'err'}`;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// PWA Service Worker 登録
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/static/sw.js').catch(() => {});
}
</script>
</body>
</html>
